{% extends "base.html" %}
{% block titulo %}Comedor{% endblock %}
{% block clase_hoja %}angosta comedor{% endblock %}
{% block contenido %}
<div class="kiosco">
  <div class="kiosco-fecha">{{ fecha|fecha_larga }}</div>
  <div class="kiosco-quien">
    <b>{{ t.nombre }}</b>
    <span>{{ 'Almuerzo' if tipo == 'almuerzo' else 'Cena' }}</span>
  </div>
  <label class="kiosco-turno">Horario
    <select onchange="document.getElementById('turno-elegido').value=this.value">
      {% for x in TURNOS[tipo] %}<option value="{{ x }}" {% if x == turno %}selected{% endif %}>{{ nombre_turno(x) }}</option>{% endfor %}
    </select>
  </label>
  <p class="kiosco-pregunta">¿Es usted?</p>
  <div class="kiosco-botones">
    <form method="POST" action="{{ u('comedor_confirmar') }}">
      <input type="hidden" name="cedula" value="{{ t.cedula }}"><input type="hidden" name="tipo" value="{{ tipo }}">
      <input type="hidden" name="turno" value="{{ turno }}" id="turno-elegido">
      <button class="btn verde kiosco-btn" type="submit" autofocus>Sí</button>
    </form>
    <form method="GET" action="{{ u('comedor') }}">
      <button class="btn suave kiosco-btn" type="submit">No</button>
    </form>
  </div>
</div>
<script>setTimeout(function(){ location.href = "{{ u('comedor') }}"; }, 30000);</script>
{% endblock %}
