{% extends "base.html" %}
{% block titulo %}Cafetería{% endblock %}
{% block clase_hoja %}angosta cafeteria{% endblock %}
{% block contenido %}
<div class="kiosco">
  <div class="kiosco-fecha">{{ fecha|fecha_larga }}</div>
  <div class="kiosco-quien">
    <b>{{ t.nombre }}</b>
    <span>{{ 'Almuerzo' if tipo == 'almuerzo' else 'Cena' }}</span>
  </div>
  <p class="kiosco-pregunta">¿Sos vos?</p>
  <div class="kiosco-botones">
    <form method="POST" action="{{ url_for('cafeteria_confirmar') }}">
      <input type="hidden" name="cedula" value="{{ t.cedula }}"><input type="hidden" name="tipo" value="{{ tipo }}">
      <button class="btn verde kiosco-btn" type="submit" autofocus>Sí</button>
    </form>
    <a class="btn suave kiosco-btn" href="{{ url_for('cafeteria') }}">No</a>
  </div>
</div>
<script>setTimeout(function(){ location.href = "{{ url_for('cafeteria') }}"; }, 20000);</script>
{% endblock %}
